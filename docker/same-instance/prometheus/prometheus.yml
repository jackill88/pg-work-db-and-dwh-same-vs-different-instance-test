global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    scenario: same_instance

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]
        labels:
          role: shared
          deployment: same_instance

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: loadgen
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          deployment: same_instance
