# Shared PostgreSQL tunables for all benchmark scenarios.
# Included by scenario-specific configs under docker/postgres/.
#
# Override: copy a scenario file (e.g. same-instance.conf) and edit values,
# then point the compose volume mount at your copy.

# Required for Docker port publishing — custom config_file replaces image defaults
listen_addresses = '*'
port = 5432

# NVMe: random reads are cheap relative to HDD defaults
random_page_cost = 1.1

# Spread checkpoint I/O to reduce latency spikes under load
checkpoint_completion_target = 0.9
max_wal_size = 2GB

# Log statements slower than 1s (useful when investigating tail latency)
log_min_duration_statement = 1000
